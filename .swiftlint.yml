# SwiftLint Configuration
# Based on Airbnb Swift Style Guide
# https://github.com/airbnb/swift

# 포함할 경로
included:
  - Modules

# 제외할 경로
excluded:
  - Tuist
  - Derived
  - .build
  - "**/Generated"
  - "**/*.generated.swift"
  - "**/Tests"

# 비활성화할 규칙
disabled_rules:
  - trailing_whitespace # Airbnb는 허용하지만 프로젝트 상황에 따라 조정

# 활성화할 Opt-in 규칙 (Airbnb 스타일)
opt_in_rules:
  - array_init
  - attributes
  - closure_end_indentation
  - closure_spacing
  - collection_alignment
  - contains_over_filter_count
  - contains_over_filter_is_empty
  - contains_over_first_not_nil
  - contains_over_range_nil_comparison
  - discouraged_object_literal
  - empty_collection_literal
  - empty_count
  - empty_string
  - enum_case_associated_values_count
  - explicit_init
  - extension_access_modifier
  - fallthrough
  - fatal_error_message
  - file_header
  - first_where
  - flatmap_over_map_reduce
  - identical_operands
  - joined_default_parameter
  - last_where
  - legacy_random
  - literal_expression_end_indentation
  - lower_acl_than_parent
  - modifier_order
  - nimble_operator
  - nslocalizedstring_key
  - number_separator
  - object_literal
  - operator_usage_whitespace
  - overridden_super_call
  - override_in_extension
  - pattern_matching_keywords
  - prefer_self_type_over_type_of_self
  - private_action
  - private_outlet
  - prohibited_interface_builder
  - prohibited_super_call
  - quick_discouraged_call
  - quick_discouraged_focused_test
  - quick_discouraged_pending_test
  - reduce_into
  - redundant_nil_coalescing
  - redundant_type_annotation
  - single_test_class
  - sorted_first_last
  - static_operator
  - strong_iboutlet
  - toggle_bool
  - unavailable_function
  - unneeded_parentheses_in_closure_argument
  - untyped_error_in_catch
  - vertical_parameter_alignment_on_call
  - vertical_whitespace_closing_braces
  - vertical_whitespace_opening_braces
  - xct_specific_matcher
  - yoda_condition

# 커스텀 규칙 설정
analyzer_rules:
  - explicit_self
  - unused_declaration
  - unused_import

# 규칙 상세 설정
attributes:
  always_on_same_line:
    - "@IBAction"
    - "@NSManaged"
    - "@objc"

closure_body_length:
  warning: 20
  error: 100

collection_alignment:
  align_colons: false

cyclomatic_complexity:
  warning: 10
  error: 20

file_length:
  warning: 500
  error: 1000
  ignore_comment_only_lines: true

force_cast: warning
force_try: warning

function_body_length:
  warning: 50
  error: 100

function_parameter_count:
  warning: 5
  error: 8

identifier_name:
  min_length:
    warning: 2
    error: 1
  max_length:
    warning: 50
    error: 60
  excluded:
    - id
    - URL
    - url

line_length:
  warning: 120
  error: 200
  ignores_urls: true
  ignores_function_declarations: true
  ignores_comments: true

modifier_order:
  preferred_modifier_order:
    - acl
    - setteracl
    - override
    - dynamic
    - mutators
    - lazy
    - final
    - required
    - convenience
    - typeMethods
    - owned

nesting:
  type_level:
    warning: 2
    error: 3
  statement_level:
    warning: 5
    error: 10

number_separator:
  minimum_length: 5

private_outlet:
  allow_private_set: false

type_body_length:
  warning: 300
  error: 500

type_name:
  min_length: 3
  max_length:
    warning: 50
    error: 60
  allowed_symbols: []
  validates_start_with_lowercase: error

vertical_whitespace:
  max_empty_lines: 1

# 커스텀 규칙
custom_rules:
  # 주석이 있는 TODO는 허용
  comments_space:
    name: "Space After Comment"
    regex: "(^ *//\\w+)"
    message: "There should be a space after //"
    severity: warning

  # 강제 언래핑 최소화
  no_direct_standard_out_logs:
    name: "No Direct Standard Out Logs"
    regex: "(print\\()"
    message: "Use proper logging instead of print()"
    severity: warning

# Reporter 타입
reporter: "xcode"
