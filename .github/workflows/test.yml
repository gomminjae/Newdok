name: Test

# GitHub Free의 macOS 러너 비용을 피하기 위해 수동 실행만 허용한다.
# 일상 검증은 모듈별 test.sh 또는 루트 scripts/test.sh로 수행한다.
on:
  workflow_dispatch:

concurrency:
  group: test-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Unit Tests
    runs-on: macos-15
    timeout-minutes: 25          # 폭주 과금 방어 (macOS는 10배 과금)
    steps:
      - uses: actions/checkout@v4

      - name: Setup mise
        uses: jdx/mise-action@v2

      - name: Cache SPM dependencies
        uses: actions/cache@v4
        with:
          path: Tuist/.build
          key: tuist-${{ runner.os }}-${{ hashFiles('Tuist/Package.resolved') }}
          restore-keys: tuist-${{ runner.os }}-

      - name: Cache DerivedData
        uses: actions/cache@v4
        with:
          path: ~/Library/Developer/Xcode/DerivedData
          key: deriveddata-test-${{ runner.os }}-${{ hashFiles('Tuist/Package.resolved') }}
          restore-keys: deriveddata-test-${{ runner.os }}-

      - name: Generate xcconfig files
        run: |
          mkdir -p Configurations
          cat <<'XCCONFIG' > Configurations/env.xcconfig
          DEV_BASE_URL = http:/$()//3.38.79.19
          BASE_URL = https:/$()/api.newdok.store
          XCCONFIG

          cat <<'XCCONFIG' > Configurations/Debug.xcconfig
          #include "env.xcconfig"
          API_BASE_URL = $(DEV_BASE_URL)
          PRODUCT_BUNDLE_IDENTIFIER = com.newdok.app.dev
          APP_DISPLAY_NAME = Newdok-Dev
          ASSETCATALOG_COMPILER_APPICON_NAME = DevAppIcon
          SWIFT_ACTIVE_COMPILATION_CONDITIONS = DEBUG
          OTHER_LDFLAGS = $(inherited) -ObjC
          XCCONFIG

          cat <<'XCCONFIG' > Configurations/Release.xcconfig
          #include "env.xcconfig"
          API_BASE_URL = $(BASE_URL)
          PRODUCT_BUNDLE_IDENTIFIER = com.newdok.app
          APP_DISPLAY_NAME = Newdok
          ASSETCATALOG_COMPILER_APPICON_NAME = AppIcon
          SWIFT_ACTIVE_COMPILATION_CONDITIONS = RELEASE
          OTHER_LDFLAGS = $(inherited) -ObjC
          XCCONFIG

      - name: Run tests
        # tuist test: 모든 모듈의 테스트 타깃을 빌드·실행하고 시뮬레이터도 자동 선택.
        # (Newdok 스킴엔 testAction이 없어 xcodebuild test는 못 씀)
        run: ./scripts/test.sh
